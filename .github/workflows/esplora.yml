name: "Esplora fonti satellite"
# Prova tecnica: scarica esempi di prodotti EUMETView (di giorno e di notte) e le loro legende.
# Parte da sola quando questo file viene modificato; il risultato va nel ramo "esplora".
on:
  push:
    paths: [".github/workflows/esplora.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esplora:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Esempi
        run: |
          mkdir -p /home/runner/e/esempi && cd /home/runner/e
          W="https://view.eumetsat.int/geoserver/wms"
          BB="41.05,11.30,43.20,14.25"
          prendi () {  # strato stile tempo larghezza altezza nome
            curl -sS -m 300 -o "esempi/$6.png" -w "$6 %{http_code} %{size_download} byte %{time_total} s\n" \
              "$W?service=WMS&version=1.3.0&request=GetMap&layers=$1&styles=$2&crs=EPSG:4326&bbox=$BB&width=$4&height=$5&format=image/png&transparent=true&time=$3" \
              < /dev/null >> esempi/esiti.txt || echo "$6 errore" >> esempi/esiti.txt
          }
          GIORNO="2026-10-28T11:00:00Z"
          NOTTE="2026-10-28T21:40:00Z"
          for L in vis06_hrfi rgb_geocolour rgb_truecolour rgb_cloudphase rgb_cloudtype ir105_hrfi; do
            prendi "mtg_fd:$L" "" "$GIORNO" 1600 1166 "giorno_$L"
          done
          for S in mtg_fd:mtg_fd_ir105_hrfi_style_01 mtg_fd:mtg_fd_ir105_hrfi_style_02; do
            prendi "mtg_fd:ir105_hrfi" "$S" "$GIORNO" 1600 1166 "giorno_ir_${S##*_style_}"
          done
          prendi "mtg_fd:rgb_geocolour" "" "$NOTTE" 1600 1166 "notte_geocolour"
          prendi "msg_fes:rgb_convection" "" "$GIORNO" 1600 1166 "giorno_msg_convection"
          prendi "msg_rss:rgb_naturalenhncd_nrt" "" "$GIORNO" 1600 1166 "giorno_msg_rss_natural"
          prendi "mtg_fd:li_afa" "" "2026-10-28T11:00:00Z" 1600 1166 "giorno_lampi"
          # lampi su tutta l'area mediterranea, per vedere come sono disegnati quando ci sono
          curl -sS -m 300 -o esempi/lampi_mediterraneo.png -w "lampi_med %{http_code} %{size_download}\n" \
            "$W?service=WMS&version=1.3.0&request=GetMap&layers=mtg_fd:li_afa&styles=&crs=EPSG:4326&bbox=30,-10,50,40&width=2000&height=800&format=image/png&transparent=true&time=2026-10-28T13:00:00Z" < /dev/null >> esempi/esiti.txt || true
          # legende
          for S in mtg_fd:mtg_fd_ir105_hrfi_grayscale mtg_fd:mtg_fd_ir105_hrfi_style_01 mtg_fd:mtg_fd_ir105_hrfi_style_02; do
            curl -sS -m 60 -o "esempi/legenda_${S##*:}.png" \
              "$W?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=mtg_fd:ir105_hrfi&style=$S&format=image/png&width=30&height=400" < /dev/null || true
          done
          curl -sS -m 60 -o esempi/legenda_li_afa.png "$W?service=WMS&version=1.3.0&request=GetLegendGraphic&layer=mtg_fd:li_afa&format=image/png" < /dev/null || true
          # SLD degli stili (per sapere esattamente come i grigi corrispondono alle temperature)
          for S in mtg_fd_ir105_hrfi_grayscale mtg_fd_ir105_hrfi_style_01 mtg_fd_ir105_hrfi_style_02; do
            curl -sS -m 60 -o "esempi/stile_$S.sld" "https://view.eumetsat.int/geoserver/rest/workspaces/mtg_fd/styles/$S.sld" < /dev/null || true
            curl -sS -m 60 -o "esempi/stile2_$S.sld" "https://view.eumetsat.int/geoserver/styles/$S.sld" < /dev/null || true
          done
          # quanto e' "fresco" l'ultimo fotogramma
          date -u > esempi/ora.txt
          curl -sS -m 120 "$W?service=WMS&version=1.3.0&request=GetCapabilities&namespace=mtg_fd" < /dev/null | \
            grep -o 'default="[^"]*"' | sort | uniq -c >> esempi/ora.txt || true
          cat esempi/esiti.txt

      - name: Pubblico nel ramo "esplora"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /home/runner/e
          git init -q -b esplora
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Esplorazione EUMETView 2"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" esplora
