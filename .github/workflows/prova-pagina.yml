# Prova della pagina in un browser vero (avvio solo a mano): apre la pagina pubblicata, prova la mappa base e il
# radar 3D, salva le schermate e gli errori del browser come allegato dell'avvio.
name: Prova della pagina
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prendo la pagina pubblicata
        run: |
          git init -q pagina && cd pagina
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" risultati && git checkout -q FETCH_HEAD
          ls radar3d || echo "radar3d mancante"
      - name: Apro la pagina in Chrome e faccio le schermate
        run: |
          pip install -q playwright
          cd pagina && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && cd ..
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(executable_path="/usr/bin/google-chrome", args=["--use-gl=swiftshader", "--enable-unsafe-swiftshader"])
              pg = b.new_page(viewport={"width": 1280, "height": 1000})
              log = []
              pg.on("pageerror", lambda e: log.append("ERRORE " + str(e)))
              pg.on("console", lambda m: log.append(m.type + " " + m.text))
              pg.goto("http://localhost:8000/index.html"); pg.wait_for_timeout(4000)
              pg.screenshot(path="base.png")
              pg.click("[data-scheda=sez-3d]"); pg.wait_for_timeout(12000)
              pg.locator("#sez-3d").screenshot(path="radar3d.png")
              pg.fill("#t3-soglia", "40"); pg.dispatch_event("#t3-soglia", "input"); pg.wait_for_timeout(3000)
              pg.locator("#v3d").screenshot(path="radar3d_forte.png")
              open("console.txt", "w").write("\n".join(log))
              b.close()
          PY
          cat console.txt
      - name: Salvo le schermate nel ramo prove-pagina
        run: |
          mkdir out && cp *.png console.txt out/ && cd out
          git init -q && git checkout -q -b prove-pagina && git add -A
          git -c user.name="prova" -c user.email="prova@localhost" commit -qm "schermate"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prove-pagina
