# Prova della pagina in un browser vero (avvio solo a mano): apre la pagina pubblicata, prova la mappa base e il
# radar 3D, salva le schermate e gli errori del browser come allegato dell'avvio.
name: Prova della pagina
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: codice
      - name: Prendo la pagina pubblicata
        run: |
          git init -q pagina && cd pagina
          git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" risultati && git checkout -q FETCH_HEAD
          ls radar3d || echo "radar3d mancante"
          cp ../codice/pagina/* .      # la pagina del ramo che si sta provando, con i dati pubblicati
      - name: Apro la pagina in Chrome e faccio le schermate
        run: |
          pip install -q playwright
          cd pagina && (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && cd ..
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(executable_path="/usr/bin/google-chrome", args=["--use-gl=swiftshader", "--enable-unsafe-swiftshader"])
              pg = b.new_page(viewport={"width": 1280, "height": 1000})
              log = []
              pg.on("pageerror", lambda e: log.append("ERRORE " + str(e)))
              pg.on("console", lambda m: log.append(m.type + " " + m.text))
              pg.goto("http://localhost:8000/index.html?prova"); pg.wait_for_timeout(4000)
              pg.screenshot(path="base.png")
              pg.set_default_timeout(90000)
              pg.click("[data-scheda=sez-3d]"); pg.wait_for_timeout(15000)
              pg.locator("#sez-3d").screenshot(path="r3_volume.png")
              for m, nome in (("1", "olografico"), ("2", "iso"), ("3", "sezione")):
                  pg.click(f"[data-modo3='{m}']"); pg.wait_for_timeout(5000)
                  pg.locator("#sez-3d").screenshot(path=f"r3_{nome}.png")
              pg.click("[data-modo3='0']"); pg.wait_for_timeout(1500)
              bb = pg.locator("#v3d").bounding_box()
              pg.mouse.move(bb["x"] + bb["width"] / 2, bb["y"] + bb["height"] / 2)
              for _ in range(8):
                  pg.mouse.wheel(0, -400); pg.wait_for_timeout(250)
              pg.wait_for_timeout(6000)
              pg.locator("#v3d").screenshot(path="r3_zoom.png")
              m = b.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=2)
              m.set_default_timeout(90000); m.on("pageerror", lambda e: log.append("MOBILE ERRORE " + str(e)))
              m.goto("http://localhost:8000/index.html?prova"); m.wait_for_timeout(3000)
              m.click("[data-scheda=sez-3d]"); m.wait_for_timeout(15000)
              m.locator("#sez-3d").screenshot(path="r3_mobile.png")
              open("console.txt", "w").write("\n".join(log))
              b.close()
          PY
          cat console.txt
      - name: Salvo le schermate nel ramo prove-pagina
        run: |
          mkdir out && cp *.png console.txt out/ && cd out
          git init -q && git checkout -q -b prove-pagina && git add -A
          git -c user.name="prova" -c user.email="prova@localhost" commit -qm "schermate"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prove-pagina
