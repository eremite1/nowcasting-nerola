name: "Nowcasting"
run-name: "Nowcasting (${{ github.event_name == 'schedule' && 'avvio di riserva' || 'avvio' }})"

# Un solo avvio lavora per circa 5 ore e 45 minuti e fa un giro ogni 10 minuti:
#   scarica radar e satellite, prevede le prossime 6 ore, verifica, disegna, pubblica nel ramo "risultati" (= pagina web).
# Alla fine fa ripartire se stesso. L'avvio orario qui sotto e' solo una riserva, nel caso la catena si interrompa:
# se un avvio e' gia' al lavoro, quello di riserva aspetta in coda e non fa danni.
# Se un giro non riesce, il registro va nel ramo "diagnosi" e il giro successivo riprova.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # quando cambia il programma parte (o si mette in coda) un avvio con il programma nuovo
  push:
    branches: [main]
    paths: ["*.py", "giro.sh", "pagina/**", "requirements.txt", ".github/workflows/nowcasting.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: nowcasting
  cancel-in-progress: false

env:
  WRF_REPO: eremite1/wrf-nerola
  MINUTI_DI_LAVORO: "340"

jobs:
  nowcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Programmi necessari
        run: pip install -q -r requirements.txt

      - name: Recupero confini, nomi e rilievo (dalla cache)
        id: cache-sfondo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v1

      - name: Scarico confini, nomi e rilievo (solo la prima volta)
        id: sfondo
        if: steps.cache-sfondo.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          python sfondo.py --scarica /home/runner/sfondo
          if [ -f /home/runner/sfondo/sfondo.json ]; then echo "completo=si" >> "$GITHUB_OUTPUT"; fi

      - name: Salvo confini, nomi e rilievo nella cache
        if: steps.sfondo.outputs.completo == 'si'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/sfondo
          key: sfondo-v1

      - name: Giri ogni 10 minuti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SFONDO: /home/runner/sfondo
          CACHE_SAT: /home/runner/cache_sat
          WRF_FILE: /home/runner/wrf/d01_tutto.npz
          NTFY_TOPIC: meteonerola-allerte
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_LINK: ${{ vars.TELEGRAM_LINK }}
        run: |
          set -u
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUB=/home/runner/pubblico
          mkdir -p /home/runner/wrf "$CACHE_SAT"
          # stato di partenza: l'ultima pubblicazione (serve per la pagella e per non ridisegnare il satellite)
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init -q -b risultati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 "$REMOTO" risultati 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          fi
          git rm -q -r --cached . >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          INIZIO=$(date +%s)
          WRF_SHA=""
          while [ $(( ($(date +%s) - INIZIO) / 60 )) -lt "$MINUTI_DI_LAVORO" ]; do
            # se nel frattempo il programma e' stato migliorato, si usa subito la versione nuova
            git -C "$GITHUB_WORKSPACE" pull -q --ff-only origin main 2>/dev/null && pip install -q -r requirements.txt >/dev/null 2>&1 || true
            # nuova previsione WRF? (si controlla ad ogni giro, si scarica solo se e' cambiata)
            S=$(git ls-remote "https://github.com/${WRF_REPO}.git" refs/heads/risultati 2>/dev/null | cut -f1 || true)
            if [ -n "$S" ] && [ "$S" != "$WRF_SHA" ]; then
              if curl -fsSL --retry 3 -o /home/runner/wrf/nuovo.npz "https://raw.githubusercontent.com/${WRF_REPO}/${S}/d01_tutto.npz"; then
                mv /home/runner/wrf/nuovo.npz "$WRF_FILE"; WRF_SHA="$S"; echo "WRF aggiornato: $S"
              fi
            fi
            if bash giro.sh "$PUB" /home/runner/nuovo; then
              # il nuovo giro prende il posto del precedente (la cartella .git resta)
              find "$PUB" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              cp -a /home/runner/nuovo/. "$PUB/"
              cd "$PUB"
              git add -A
              # (il primo commit di ogni avvio riparte da zero: la storia del ramo resta corta)
              git commit -q -m "Nowcasting $(date -u +%Y-%m-%dT%H:%MZ)" || true
              git push -q -f "$REMOTO" risultati && echo "pubblicato $(date -u +%H:%M) UTC" || echo "ATTENZIONE: pubblicazione non riuscita"
              cd "$GITHUB_WORKSPACE"
              tail -n 4 /home/runner/nuovo/registro.txt
            else
              echo "GIRO NON RIUSCITO alle $(date -u +%H:%M) UTC, registro nel ramo diagnosi"
              tail -n 30 /home/runner/nuovo/registro.txt || true
              rm -rf /home/runner/diag && mkdir -p /home/runner/diag && cd /home/runner/diag
              cp /home/runner/nuovo/registro.txt . 2>/dev/null || echo "nessun registro" > registro.txt
              echo "Giro fallito: $(date -u +%Y-%m-%dT%H:%MZ), https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > LEGGIMI.txt
              git init -q -b diagnosi && git add -A
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Diagnosi $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "$REMOTO" diagnosi || true
              cd "$GITHUB_WORKSPACE"
            fi
            # aspetto il prossimo giro: ai minuti 7, 17, 27, 37, 47, 57 (il radar delle :X0 e' pronto da qualche minuto)
            ADESSO=$(date +%s)
            PROSSIMO=$(( (ADESSO / 600) * 600 + 420 ))
            [ "$PROSSIMO" -le $((ADESSO + 30)) ] && PROSSIMO=$((PROSSIMO + 600))
            sleep $(( PROSSIMO - ADESSO ))
          done
          echo "Tempo di lavoro finito: riparte un nuovo avvio"

      - name: Faccio ripartire il nowcasting
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run nowcasting.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "riavvio non riuscito, ci pensa l avvio di riserva"
